name: k6 smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * 1" # Mondays: keep the repo honest about API reachability

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run smoke test
        run: mkdir -p results && k6 run scripts/smoke.js

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-summary
          path: results/smoke.json
